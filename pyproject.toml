[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "*/migrations/*", "staticfiles", "docs/build"]

[tool.ruff.lint]
# Fokus pada kesalahan nyata (bukan preferensi gaya) agar mudah dijalankan tim kecil.
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/apps/*/tests.py" = ["F401"]
